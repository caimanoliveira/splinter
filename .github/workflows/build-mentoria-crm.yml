name: build mentoria-crm
on:
  pull_request:
    paths:
      - 'mentoria-crm/**'
  workflow_dispatch:

jobs:
  build:
    name: Build mentoria-crm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mentoria-crm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mentoria-crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: 1
          NEXT_TELEMETRY_DISABLED: 1
